<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>โปรไฟล์อิเล็กทรอนิกส์ - พิมพ์ชนก เข็มนางรอง</title>
    <!-- นำเข้า Tailwind CSS สำหรับการตกแต่ง -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- นำเข้า FontAwesome สำหรับไอคอน -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- นำเข้าฟอนต์ Prompt จาก Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Prompt', sans-serif;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-900 via-pink-950 to-slate-900 min-h-screen flex items-center justify-center p-4 text-slate-100">

    <!-- การ์ดโปรไฟล์ -->
    <div class="w-full max-w-md bg-slate-800/80 backdrop-blur-xl border border-slate-700 rounded-3xl shadow-2xl overflow-hidden p-6 text-center relative">
        
        <!-- แบนเนอร์ตกแต่งส่วนหัว -->
        <div class="absolute top-0 left-0 right-0 h-28 bg-gradient-to-r from-pink-500 via-purple-500 to-indigo-500 opacity-80"></div>

        <!-- รูปโปรไฟล์ -->
        <div class="relative mt-10 mb-4">
            <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=300&q=80" 
                 alt="พิมพ์ชนก เข็มนางรอง" 
                 class="w-28 h-28 mx-auto rounded-full object-cover border-4 border-slate-800 shadow-lg">
        </div>

        <!-- ชื่อและรายละเอียดส่วนตัว -->
        <h1 class="text-2xl font-bold text-white mb-1">พิมพ์ชนก เข็มนางรอง</h1>
        <p class="text-pink-400 font-medium text-sm mb-2">นักศึกษา • อายุ 19 ปี</p>
        
        <!-- สถานศึกษา -->
        <div class="inline-flex items-center space-x-2 bg-slate-700/50 px-3 py-1.5 rounded-full text-slate-300 text-xs mb-6 border border-slate-600">
            <i class="fa-solid fa-graduation-cap text-pink-400"></i>
            <span>วิทยาลัยเทคนิคนางรอง</span>
        </div>

        <!-- รายการลิงก์ติดต่อ (Buttons) -->
        <div class="space-y-3">
            
            <!-- เบอร์โทรศัพท์ -->
            <a href="tel:0812345678" class="flex items-center justify-between p-3.5 rounded-xl bg-slate-700/60 hover:bg-pink-600 border border-slate-600 hover:border-pink-500 transition-all duration-300 group shadow-md">
                <div class="flex items-center space-x-3">
                    <div class="w-9 h-9 rounded-lg bg-pink-500/20 flex items-center justify-center text-pink-400 group-hover:bg-white group-hover:text-pink-600 transition-colors">
                        <i class="fa-solid fa-phone"></i>
                    </div>
                    <span class="font-medium text-sm">โทรติดต่อ (Call)</span>
                </div>
                <i class="fa-solid fa-chevron-right text-xs text-slate-400 group-hover:text-white"></i>
            </a>

            <!-- LINE -->
            <a href="https://line.me" target="_blank" class="flex items-center justify-between p-3.5 rounded-xl bg-slate-700/60 hover:bg-emerald-600 border border-slate-600 hover:border-emerald-500 transition-all duration-300 group shadow-md">
                <div class="flex items-center space-x-3">
                    <div class="w-9 h-9 rounded-lg bg-emerald-500/20 flex items-center justify-center text-emerald-400 group-hover:bg-white group-hover:text-emerald-600 transition-colors">
                        <i class="fa-brands fa-line"></i>
                    </div>
                    <span class="font-medium text-sm">เพิ่มเพื่อนทาง LINE</span>
                </div>
                <i class="fa-solid fa-chevron-right text-xs text-slate-400 group-hover:text-white"></i>
            </a>

            <!-- Facebook -->
            <a href="https://facebook.com" target="_blank" class="flex items-center justify-between p-3.5 rounded-xl bg-slate-700/60 hover:bg-blue-600 border border-slate-600 hover:border-blue-500 transition-all duration-300 group shadow-md">
                <div class="flex items-center space-x-3">
                    <div class="w-9 h-9 rounded-lg bg-blue-500/20 flex items-center justify-center text-blue-400 group-hover:bg-white group-hover:text-blue-600 transition-colors">
                        <i class="fa-brands fa-facebook"></i>
                    </div>
                    <span class="font-medium text-sm">Facebook</span>
                </div>
                <i class="fa-solid fa-chevron-right text-xs text-slate-400 group-hover:text-white"></i>
            </a>

            <!-- Instagram -->
            <a href="https://instagram.com" target="_blank" class="flex items-center justify-between p-3.5 rounded-xl bg-slate-700/60 hover:bg-purple-600 border border-slate-600 hover:border-purple-500 transition-all duration-300 group shadow-md">
                <div class="flex items-center space-x-3">
                    <div class="w-9 h-9 rounded-lg bg-purple-500/20 flex items-center justify-center text-purple-400 group-hover:bg-white group-hover:text-purple-600 transition-colors">
                        <i class="fa-brands fa-instagram"></i>
                    </div>
                    <span class="font-medium text-sm">Instagram</span>
                </div>
                <i class="fa-solid fa-chevron-right text-xs text-slate-400 group-hover:text-white"></i>
            </a>

        </div>

        <!-- ปุ่มแชร์โปรไฟล์ -->
        <div class="mt-6 pt-4 border-t border-slate-700 flex justify-center">
            <button onclick="navigator.clipboard.writeText(window.location.href); alert('คัดลอกลิงก์โปรไฟล์เรียบร้อยแล้ว!');" class="text-xs bg-slate-700 hover:bg-slate-600 text-slate-300 px-4 py-2 rounded-full transition-colors flex items-center space-x-1">
                <i class="fa-solid fa-share-nodes mr-1"></i> แชร์โปรไฟล์
            </button>
        </div>

        <!-- ส่วนท้าย (Footer) -->
        <div class="mt-4 text-[10px] text-slate-500">
            Digital Profile © 2026 • พิมพ์ชนก เข็มนางรอง
        </div>

    </div>

</body>
</html>
